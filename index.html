<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сомелье — Твой эксперт</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .prose-custom {
            font-size: 1rem;
            line-height: 1.7;
            padding: 1.5rem;
        }
        
        @media (max-width: 640px) {
            .prose-custom { padding: 1rem; font-size: 0.95rem; }
        }
        
        .prose-custom p { margin-bottom: 1.25rem; color: #cbd5e1; }
        
        .prose-custom h2 { 
            color: #fbbf24; 
            font-weight: 900; 
            font-size: 1.75rem;
            margin-top: 1rem; 
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .prose-custom h3 {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #fbbf24;
            width: 100%;
        }

        .loader {
            border: 3px solid rgba(251, 191, 36, 0.1);
            border-top: 3px solid #fbbf24;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .speaking-pulse {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .btn-primary {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #0f172a;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-primary:active { transform: scale(0.96); }

        .round-lang-toggle {
            @apply w-10 h-10 sm:w-12 sm:h-12 rounded-full glass-card flex items-center justify-center font-black text-xs cursor-pointer transition-all border-2 border-yellow-500/20 active:scale-90 hover:border-yellow-500/50;
            color: #fbbf24;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .tab-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }
    </style>
</head>
<body class="pb-12">

    <header class="p-4 sm:p-6 sticky top-0 z-50 glass-card rounded-b-[1.5rem] sm:rounded-b-[2.5rem] border-none shadow-2xl">
        <div class="flex items-center justify-between max-w-4xl mx-auto">
            <h1 id="app-logo" class="text-lg sm:text-xl font-black bg-gradient-to-r from-yellow-400 via-orange-500 to-yellow-600 bg-clip-text text-transparent">
                МОЙ СОМЕЛЬЕ
            </h1>
            <div class="flex items-center gap-3 sm:gap-4">
                <button onclick="toggleLanguage()" id="lang-btn-round" class="round-lang-toggle shadow-lg">
                    RU
                </button>
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-yellow-500/10 flex items-center justify-center border border-yellow-500/20">
                    <i class="fas fa-wine-glass-alt text-yellow-500 text-sm sm:text-base"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6 sm:space-y-8">
        <!-- Адаптивная навигация (без сканера) -->
        <div class="flex gap-2 sm:gap-3 justify-center">
            <button onclick="switchTab('sommelier')" id="tab-sommelier" class="tab-btn px-6 sm:px-10 py-3 sm:py-4 rounded-xl sm:rounded-2xl glass-card font-bold text-xs sm:text-sm border-yellow-500/40 border shadow-lg text-yellow-500">🍷 <span data-i18n="nav-expert">Эксперт</span></button>
            <button onclick="switchTab('mix')" id="tab-mix" class="tab-btn px-6 sm:px-10 py-3 sm:py-4 rounded-xl sm:rounded-2xl glass-card font-bold text-xs sm:text-sm">✨ <span data-i18n="nav-mix">Создать</span></button>
        </div>

        <!-- Section: Sommelier -->
        <section id="section-sommelier" class="tab-content active space-y-4">
            <div class="glass-card p-6 sm:p-10 rounded-[2rem] sm:rounded-[3rem] text-center space-y-6 sm:space-y-8 border-2 border-yellow-500/10 shadow-2xl relative overflow-hidden">
                <div class="w-16 h-16 sm:w-24 sm:h-24 bg-gradient-to-br from-yellow-400/20 to-orange-600/20 rounded-full flex items-center justify-center mx-auto border-2 border-yellow-500/30">
                    <i class="fas fa-award text-yellow-500 text-2xl sm:text-4xl"></i>
                </div>
                <h2 id="sommelier-title-text" class="text-xl sm:text-3xl font-black italic uppercase text-yellow-500" data-i18n="som-title">Совет Сомелье</h2>
                
                <button onclick="getSommelierAdvice()" id="btn-sommelier" class="w-full py-4 sm:py-5 btn-primary rounded-xl sm:rounded-[1.5rem]" data-i18n="btn-advice">Получить совет ✨</button>
                
                <div id="sommelier-result-box" class="hidden p-5 sm:p-8 bg-slate-900/50 rounded-xl sm:rounded-[2rem] border border-yellow-500/20">
                    <div id="sommelier-result" class="text-base sm:text-lg text-yellow-100 italic"></div>
                </div>
            </div>
        </section>

        <!-- Section: Mix -->
        <section id="section-mix" class="tab-content space-y-6">
            <div class="glass-card p-5 sm:p-8 rounded-[2rem] sm:rounded-[3rem] border border-indigo-500/20 shadow-xl">
                <textarea id="mix-mood" rows="3" placeholder="Опишите ваши предпочтения..." data-i18n-placeholder="mix-placeholder" class="w-full bg-slate-800/40 border border-slate-700 p-4 sm:p-5 rounded-xl sm:rounded-[1.5rem] mb-4 sm:mb-6 text-white outline-none focus:ring-2 ring-yellow-500 transition-all text-sm sm:text-base"></textarea>
                <button onclick="askGeminiForRecipe()" id="btn-mix" class="w-full btn-primary py-4 sm:py-5 rounded-xl sm:rounded-[1.5rem]" data-i18n="btn-mix">Смешать шедевр ✨</button>
            </div>
            
            <div id="recipe-result" class="hidden glass-card rounded-[2rem] sm:rounded-[3rem] flex flex-col border border-yellow-500/20 overflow-hidden">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center px-6 sm:px-8 pt-6 sm:pt-8 pb-4 gap-4">
                    <h3 class="text-lg sm:text-xl font-black text-yellow-500 uppercase" data-i18n="recipe-header">Рецепт бармена</h3>
                    <div id="audio-controls" class="flex items-center gap-4 sm:gap-8 opacity-0 transition-opacity w-full sm:w-auto justify-between sm:justify-end">
                        <div id="tts-status" class="hidden text-[9px] sm:text-[10px] font-bold text-yellow-500/70 uppercase tracking-widest">Voice...</div>
                        <div class="flex items-center gap-4">
                            <button onclick="restartAudio()" class="audio-btn text-white/60 hover:text-white"><i class="fas fa-redo-alt"></i></button>
                            <button id="btn-tts-toggle" onclick="togglePlayback()" class="bg-yellow-500 text-slate-900 w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center shadow-lg transition-all hover:scale-110">
                                <i id="tts-icon" class="fas fa-play text-base sm:text-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div id="recipe-content" class="prose-custom"></div>
            </div>
        </section>
    </main>

    <script>
        const apiKey = ""; 
        let currentLang = 'ru';
        let lastGeneratedText = "";
        let audioContext = null;
        let currentSource = null;
        let audioQueue = []; 
        let currentPartIndex = 0;
        let isPlaying = false;
        let isAborted = false;
        let isFetchingFinished = false;

        let lastSommelierText = "";
        let isSommelierLoading = false;

        const translations = {
            ru: {
                "logo": "МОЙ СОМЕЛЬЕ",
                "nav-expert": "Эксперт",
                "nav-mix": "Смешать",
                "som-title": "Совет Сомелье",
                "som-wisdom": "Мудрость бокала",
                "btn-advice": "Получить совет ✨",
                "mix-placeholder": "Опишите ваши предпочтения или настроение...",
                "btn-mix": "Смешать шедевр ✨",
                "recipe-header": "Рецепт бармена",
                "status-preparing": "ПОДГОТОВКА...",
                "status-speaking": "ГОВОРИТ",
                "status-loading": "ЗАГРУЗКА...",
                "status-done": "ГОТОВО",
                "wait": "Подбираю...",
                "translating": "Перевожу..."
            },
            en: {
                "logo": "MY SOMMELIER",
                "nav-expert": "Expert",
                "nav-mix": "Mix",
                "som-title": "Sommelier Advice",
                "som-wisdom": "Glass Wisdom",
                "btn-advice": "Get Advice ✨",
                "mix-placeholder": "Describe your mood or preferences...",
                "btn-mix": "Mix Masterpiece ✨",
                "recipe-header": "Bartender's Recipe",
                "status-preparing": "PREPARING...",
                "status-speaking": "SPEAKING",
                "status-loading": "LOADING...",
                "status-done": "DONE",
                "wait": "Searching...",
                "translating": "Translating..."
            }
        };

        function toggleLanguage() {
            const nextLang = currentLang === 'ru' ? 'en' : 'ru';
            setLanguage(nextLang);
        }

        async function setLanguage(lang) {
            currentLang = lang;
            const btn = document.getElementById('lang-btn-round');
            btn.innerText = lang.toUpperCase();
            
            btn.style.transform = "rotateY(360deg)";
            setTimeout(() => btn.style.transform = "rotateY(0deg)", 300);

            document.getElementById('app-logo').innerText = translations[lang]["logo"];
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key !== 'som-title' && key !== 'som-wisdom') {
                    el.innerText = translations[lang][key];
                }
            });

            const somTitleEl = document.getElementById('sommelier-title-text');
            const isWisdom = somTitleEl.getAttribute('data-current-mode') === 'wisdom';
            somTitleEl.innerText = isWisdom ? translations[lang]['som-wisdom'] : translations[lang]['som-title'];

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = translations[lang][key];
            });

            if (lastSommelierText && !isSommelierLoading) {
                translateSommelierResult();
            }
        }

        async function translateSommelierResult() {
            const resBox = document.getElementById('sommelier-result');
            const originalText = resBox.innerText;
            if (!originalText || originalText === translations[currentLang].translating) return;

            resBox.innerText = translations[currentLang].translating;
            
            try {
                const targetLang = currentLang === 'ru' ? 'Russian' : 'English';
                const prompt = `Translate the following text into ${targetLang}. Keep the style. Text: "${originalText}"`;
                const translated = await callGemini(prompt);
                const cleanText = translated.trim().replace(/\*\*/g, '').replace(/^"|"$/g, '');
                resBox.innerText = cleanText;
                lastSommelierText = cleanText;
            } catch (e) {
                resBox.innerText = originalText;
            }
        }

        async function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            }
            return audioContext;
        }

        function createWavHeader(dataLength, sampleRate) {
            const buffer = new ArrayBuffer(44);
            const view = new DataView(buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); 
            view.setUint16(22, 1, true); 
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, dataLength, true);
            return new Uint8Array(buffer);
        }

        function switchTab(tabId) {
            const currentTab = document.querySelector('.tab-content.active');
            const nextTab = document.getElementById('section-' + tabId);
            
            if (currentTab === nextTab) return;

            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-yellow-500/40', 'border', 'shadow-lg', 'text-yellow-500');
            });
            document.getElementById('tab-' + tabId).classList.add('border-yellow-500/40', 'border', 'shadow-lg', 'text-yellow-500');

            if (currentTab) {
                currentTab.style.opacity = '0';
                currentTab.style.transform = 'translateY(10px)';
                
                setTimeout(() => {
                    currentTab.classList.remove('active');
                    currentTab.style.display = 'none';
                    
                    nextTab.style.display = 'block';
                    nextTab.offsetHeight; 
                    nextTab.classList.add('active');
                    nextTab.style.opacity = '1';
                    nextTab.style.transform = 'translateY(0)';
                }, 400); 
            } else {
                nextTab.classList.add('active');
            }
        }

        async function fetchWithRetry(url, options, retries = 5) {
            let backoff = 1000;
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return await response.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(r => setTimeout(r, backoff));
                    backoff *= 2;
                }
            }
        }

        async function callGemini(prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const data = await fetchWithRetry(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        }

        async function getSommelierAdvice() {
            const resBox = document.getElementById('sommelier-result');
            const box = document.getElementById('sommelier-result-box');
            const titleEl = document.getElementById('sommelier-title-text');
            const btn = document.getElementById('btn-sommelier');
            
            isSommelierLoading = true;
            btn.disabled = true;
            btn.innerText = translations[currentLang].wait;
            
            try {
                const useQuote = Math.random() > 0.5;
                let prompt = "";
                
                if (useQuote) {
                    prompt = currentLang === 'ru' 
                        ? "Напиши ОДНУ реальную цитату известного человека об алкоголе или вине. Формат: Цитата — Автор."
                        : "Write ONE authentic quote about alcohol or wine. Format: Quote — Author.";
                    titleEl.innerText = translations[currentLang]["som-wisdom"];
                    titleEl.setAttribute('data-current-mode', 'wisdom');
                } else {
                    prompt = currentLang === 'ru'
                        ? "Дай один короткий профессиональный совет сомелье на русском языке."
                        : "Give one short professional sommelier advice in English.";
                    titleEl.innerText = translations[currentLang]["som-title"];
                    titleEl.setAttribute('data-current-mode', 'advice');
                }

                const text = await callGemini(prompt);
                const cleanText = text.trim().replace(/\*\*/g, '').replace(/^"|"$/g, '');
                lastSommelierText = cleanText;
                
                box.classList.remove('hidden');
                box.classList.add('fade-in');
                resBox.innerText = lastSommelierText;
            } finally {
                isSommelierLoading = false;
                btn.disabled = false;
                btn.innerText = translations[currentLang]["btn-advice"];
            }
        }

        async function askGeminiForRecipe() {
            const mood = document.getElementById('mix-mood').value;
            if (!mood) return;
            
            await initAudioContext();
            resetAudioState();

            const resSection = document.getElementById('recipe-result');
            const content = document.getElementById('recipe-content');
            resSection.classList.remove('hidden');
            resSection.classList.add('fade-in');
            content.innerHTML = '<div class="flex justify-center p-12"><div class="loader"></div></div>';
            document.getElementById('audio-controls').style.opacity = "0";

            try {
                const systemPrompt = currentLang === 'ru' 
                    ? "Ты элитный сомелье. Напиши уникальный рецепт напитка на русском языке. Заголовок, ингредиенты и метод. Подробно опиши вкус."
                    : "You are an elite sommelier. Write a unique drink recipe in English. Title, ingredients, and method. Describe the taste profile in detail.";
                
                const text = await callGemini(`${systemPrompt} Mood/Context: ${mood}`);
                lastGeneratedText = text;
                content.innerHTML = marked.parse(text);
                document.getElementById('audio-controls').style.opacity = "1";
                startStreamingAudio();
            } catch (e) {
                content.innerHTML = `<p class="text-center p-8 text-red-400">Error: ${e.message}</p>`;
            }
        }

        function resetAudioState() {
            isAborted = true;
            stopAudioInternal();
            audioQueue = [];
            currentPartIndex = 0;
            isPlaying = false;
            isFetchingFinished = false;
            updateUI();
        }

        async function fetchAudioPart(text) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
            const voice = currentLang === 'en' ? "Puck" : "Charon"; 
            
            const result = await fetchWithRetry(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }],
                    generationConfig: { 
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
                    }
                })
            });

            const base64Data = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
            if (!base64Data) return null;

            const binaryString = atob(base64Data);
            const rawBuffer = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) rawBuffer[i] = binaryString.charCodeAt(i);

            const wavHeader = createWavHeader(rawBuffer.length, 24000);
            const wavFull = new Uint8Array(wavHeader.length + rawBuffer.length);
            wavFull.set(wavHeader, 0);
            wavFull.set(rawBuffer, wavHeader.length);

            return await audioContext.decodeAudioData(wavFull.buffer);
        }

        function splitTextForTTS(text) {
            let clean = text.replace(/[*_#~`-]/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\n+/g, ' ').trim();
            const chunks = [];
            const sentences = clean.split(/([.!?]\s+)/);
            let currentChunk = "";

            for (let part of sentences) {
                if ((currentChunk + part).length > 150) {
                    if (currentChunk) chunks.push(currentChunk.trim());
                    currentChunk = part;
                } else {
                    currentChunk += part;
                }
            }
            if (currentChunk) chunks.push(currentChunk.trim());
            return chunks;
        }

        async function startStreamingAudio() {
            isAborted = false;
            isFetchingFinished = false;
            
            const finalChunks = splitTextForTTS(lastGeneratedText);
            const status = document.getElementById('tts-status');
            status.innerText = translations[currentLang]["status-preparing"];
            status.classList.remove('hidden');

            for (let i = 0; i < finalChunks.length; i++) {
                if (isAborted) return;
                try {
                    const buf = await fetchAudioPart(finalChunks[i]);
                    if (buf && !isAborted) {
                        audioQueue.push(buf);
                        if (!isPlaying && currentPartIndex < audioQueue.length) {
                            playNextInQueue();
                        }
                    }
                } catch (e) { console.error("TTS Error:", e); }
            }
            isFetchingFinished = true;
        }

        function playNextInQueue() {
            if (isAborted) return;
            const status = document.getElementById('tts-status');

            if (currentPartIndex >= audioQueue.length) {
                if (!isFetchingFinished) {
                    isPlaying = false;
                    status.innerText = translations[currentLang]["status-loading"];
                    updateUI();
                    return;
                } else {
                    isPlaying = false;
                    status.innerText = translations[currentLang]["status-done"];
                    updateUI();
                    return;
                }
            }

            stopAudioInternal();
            
            const buf = audioQueue[currentPartIndex];
            currentSource = audioContext.createBufferSource();
            currentSource.buffer = buf;
            currentSource.connect(audioContext.destination);
            
            currentSource.onended = () => {
                if (!isAborted) {
                    currentPartIndex++;
                    playNextInQueue();
                }
            };

            currentSource.start(0);
            isPlaying = true;
            status.innerText = translations[currentLang]["status-speaking"];
            updateUI();
        }

        function stopAudioInternal() {
            if (currentSource) {
                currentSource.onended = null;
                try { currentSource.stop(); } catch(e) {}
                currentSource = null;
            }
        }

        async function togglePlayback() {
            const ctx = await initAudioContext();
            if (isPlaying) {
                await ctx.suspend();
                isPlaying = false;
                updateUI();
            } else {
                if (ctx.state === 'suspended') {
                    await ctx.resume();
                    isPlaying = true;
                    updateUI();
                } else {
                    if (audioQueue.length > 0) {
                        if (currentPartIndex >= audioQueue.length) currentPartIndex = 0;
                        playNextInQueue();
                    }
                }
            }
        }

        async function restartAudio() {
            const ctx = await initAudioContext();
            if (ctx.state === 'suspended') await ctx.resume();
            stopAudioInternal();
            currentPartIndex = 0;
            isPlaying = true; 
            playNextInQueue();
        }

        function updateUI() {
            const icon = document.getElementById('tts-icon');
            const btn = document.getElementById('btn-tts-toggle');
            if (isPlaying) {
                icon.className = 'fas fa-pause';
                btn.classList.add('speaking-pulse');
            } else {
                icon.className = 'fas fa-play ml-1';
                btn.classList.remove('speaking-pulse');
            }
        }
    </script>
</body>
</html>
